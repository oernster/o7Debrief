# Build and tooling configuration for o7Debrief.
# British spelling used throughout comments. No em dashes anywhere.

[build-system]
# setuptools as the build backend, declared here so no setup.py is needed.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o7debrief"
dynamic = ["version"]
description = "Elite Dangerous Commander mission debrief generator."
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-3.0-or-later"
authors = [{ name = "Oliver Ernster" }]
dependencies = [
    "PySide6>=6.6",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
# Development-only tooling: test runner, coverage, formatter and linter.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "flake8>=7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
# Discover the o7debrief package (and its subpackages) from the repo root.
include = ["o7debrief*"]

[tool.setuptools.dynamic]
# VERSION (project root) is the single source of truth for the app version.
version = { file = "VERSION" }

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
# black is the formatter of record, so ruff is told the same shape rather than
# being left to disagree with it.
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# flake8 is the linter the project enforces and it reports E402, so the deferred
# imports in tools/ and in the installer worker test carry a deliberate
# `# noqa: E402` each. ruff does not enable E402 by default, which made it read
# every one of those markers as an unused directive; `ruff --fix` would then have
# stripped the markers and re-sorted the imports they exist to protect, breaking
# the scripts. Enabling the rule here is what makes the two linters agree about
# the code they both read, so a clean flake8 run and a clean ruff run mean the
# same thing.
extend-select = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Four files where the two linters genuinely disagree, rather than four
# exemptions of convenience. ruff's E402 tolerates a few statements before an
# import that flake8 does not, so it reads the marker on those imports as an
# unnecessary suppression while flake8 reports the import without it. That was
# checked rather than assumed: removing the markers makes flake8 report fifteen
# E402 errors across these files. flake8 is the linter this project enforces, so
# the markers stay and ruff is told not to call them unused here. The last entry
# is the same disagreement over a capture script's deliberate private read, which
# ruff would only accept if SLF001 were enabled across the tree, where it would
# fire on every test that reaches into an object it is testing.
"tools/capture_home_dialog.py" = ["RUF100"]
"tools/capture_tray_menu.py" = ["RUF100"]
"tools/capture_installer_window.py" = ["RUF100"]
"tests/installer/test_worker_shutdown.py" = ["RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The hard gate covers the two pure layers of the application (domain and
# application) plus the two Qt-free halves of the setup program. The installer
# does the most privileged work in the product (registry writes, shortcut
# creation, per-user deployment, uninstall), so its operations and its state
# model are gated rather than left unmeasured; installer/ui and installer/app.py
# are the Qt client and are excluded on the same grounds as o7debrief/ui.
#
# The whole infrastructure layer joins them. It was held out while it measured
# 86%, the shortfall being the OS-specific journal discovery a test on one
# machine cannot walk. That turned out to be a gap in the tests rather than a
# property of the code: discovery builds its candidate paths from environment
# variables and a home directory, so it is ordinary logic and is now driven
# through a stand-in for os, with only the final existence check touching the
# filesystem. Naming the layer rather than its sub-packages is deliberate: a
# new adapter is gated the moment it is added rather than when someone
# remembers to list it.
addopts = "--cov=o7debrief.domain --cov=o7debrief.application --cov=o7debrief.infrastructure --cov=installer.ops --cov=installer.state --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
# What the gate covers is decided by the packages named in addopts, not here:
# nothing outside them is measured at all. So this list holds only what a bare
# "pytest --cov" would otherwise pull in. It named the application's own layers
# once, which was both redundant and misleading. It also named a path that does
# not exist (the composition root is main.py at the repository root, never
# o7debrief/main.py). Worse, omitting a layer here silences it even when
# coverage is asked for it explicitly, which is why measuring infrastructure
# reported no data at all.
omit = [
    # The test suite is not production surface. Its only uncovered lines are the
    # structural checks' failure branches, which fire solely on a dirty tree, so
    # measuring it would gate coverage on negative paths a clean codebase cannot
    # reach. A bare "pytest --cov" would otherwise pull the whole suite in.
    "tests/*",
    # PySide6 injects these virtual modules into the import path at runtime; they
    # have no on-disk source, so coverage cannot parse them.
    "shibokensupport/*",
    "signature_bootstrap.py",
    "pyscript",
]

[tool.coverage.report]
# Lines that are structurally unreachable or are pure declarations and so
# must not count against the 100% gate.
exclude_lines = [
    "pragma: no cover",
    "\\.\\.\\.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
